name: End-to-end

# A real PowerNukkitX server (Bedrock 1.26.60, NetherNet, built from the fork the Linesia server runs), the
# proxy and the headless Java client. About 30 minutes: run on pull requests, on the default branch
# and on demand.
on:
  workflow_dispatch:
    inputs:
      pnx_repo:
        description: PowerNukkitX repository (Bedrock 1.26.60, NetherNet)
        default: Wyze3306/PowerNukkitX
      pnx_ref:
        description: PowerNukkitX branch, tag or commit
        default: master
  pull_request:
  push:
    branches: [main]

# A newer push replaces a run still in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pnx_repo || 'Wyze3306/PowerNukkitX' }}
          ref: ${{ inputs.pnx_ref || 'master' }}
          path: pnx-src
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build PowerNukkitX
        run: cd pnx-src && ./gradlew shadowJar --no-daemon --no-configuration-cache
      - name: Scenarios
        run: |
          status=0
          # scenario:seconds (each scenario documents how long it needs)
          for run in default:40 world:40 player:40 entity:40 chat:40 sound:40 world_travel:40 form:60 chest_menu:40 ui:60 resource_pack:40 inventory_custom_items:60 inventory:160 inventory_menus:230 item_frame:200; do
            scenario=${run%%:*}
            echo "::group::$scenario"
            tools/e2e/run.sh pnx-src/build/powernukkitx.jar "$scenario" "${run##*:}" || { status=1; echo "::error::scenario $scenario failed"; }
            mkdir -p build/e2e-logs/$scenario && cp build/e2e/*.log build/e2e-logs/$scenario/
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: build/e2e-logs
