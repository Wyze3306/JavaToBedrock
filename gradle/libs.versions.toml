[versions]
mcprotocollib = "26.3"
bedrock-protocol = "3.0.0.Beta7-Debug-SNAPSHOT"
netty = "4.2.17.Final"
# Same RakNet transport as the PowerNukkitX server
raknet = "2.0.0.CR4-20260922.202324-5"
fastutil = "8.5.19"
adventure = "5.2.0"
gson = "2.14.0"
snakeyaml = "2.6"
log4j = "2.26.1"
junit = "6.1.3"

[libraries]
mcprotocollib = { module = "org.geysermc.mcprotocollib:protocol", version.ref = "mcprotocollib" }
bedrock-connection = { module = "org.powernukkitx.protocol:bedrock-connection", version.ref = "bedrock-protocol" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
netty-raknet = { module = "org.cloudburstmc.netty:netty-transport-raknet", version.ref = "raknet" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "8.3.9" }
